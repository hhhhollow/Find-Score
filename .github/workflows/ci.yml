name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync locked environment
        run: uv sync --frozen --python "${{ matrix.python-version }}"

      - name: Check installed dependencies
        run: uv pip check

      - name: Run tests with coverage
        run: >-
          uv run --with coverage
          coverage run --source=grade_monitor
          -m unittest discover -s tests -v

      - name: Report coverage
        run: uv run --with coverage coverage report --show-missing

      - name: Ruff
        if: matrix.python-version == '3.13'
        run: uv run --with ruff ruff check .

      - name: Pyright
        if: matrix.python-version == '3.13'
        run: uv run --with pyright pyright
