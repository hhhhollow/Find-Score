[project]
name = "find-score"
version = "2.0.0"
description = "Minimal BISTU grade monitor with Bark notifications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pycryptodome>=3.20.0",
    "requests>=2.31.0",
]

[project.scripts]
find-score = "grade_monitor.__main__:main"
find-score-service = "grade_monitor.service:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "grade_monitor"
module-root = ""

[tool.pyright]
include = ["grade_monitor"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
